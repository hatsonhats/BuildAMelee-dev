# Anchor edits (overrides/README.md): each finds `anchor` in a retail source
# file of the decomp and replaces it. Applied after the line edits in
# line_edits.json, file by file in name order, fix by fix in order.
#
# Training mode: setup and restart, and the hitbox/hurtbox display options.

[[fix]]
id = "training-prepare"
owner = "platform/training"
file = "src/melee/gm/gmtrainingmode.c"
anchor = "    gm_LoadRumbleEnabled(data);\n    gm_80189CDC(data);"
replacement = "    {\n        extern void BAM_TrainingPrepare(StartMeleeData* data);\n        BAM_TrainingPrepare(data);\n    }\n    gm_LoadRumbleEnabled(data);\n    gm_80189CDC(data);"
reason = "The training match's players are set: map the player's port build onto match slot 0 (the CPU gets none) and start the training session."

[[fix]]
id = "training-restart"
owner = "platform/training"
file = "src/melee/gm/gmtrainingmode.c"
anchor = "    temp_r3 = gm_GetGameModeStateExitData(arg0);\n    gm_80162968(temp_r3->match_end.frame_count / 60);"
replacement = "    temp_r3 = gm_GetGameModeStateExitData(arg0);\n    {\n        extern int BAM_TrainingTakeRestart(void);\n        if (BAM_TrainingTakeRestart()) {\n            /* A build change from the training menu: load the match again\n             * (cut short, so no play stats). */\n            gm_SetNextGameModeStateId(2);\n            return;\n        }\n    }\n    gm_80162968(temp_r3->match_end.frame_count / 60);"
reason = "Restart the training match after a build change instead of returning to the character select screen. Ordinary exits are unchanged."

