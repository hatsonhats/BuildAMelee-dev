# Anchor edits (overrides/README.md): each finds `anchor` in a retail source
# file of the decomp and replaces it. Applied after the line edits in
# special_adapters.json, file by file in name order, fix by fix in order.
#
# Borrowed moves: the engine's edits to retail code every borrowed move goes
# through (animation retargeting, hitboxes on rebuilt bones, articles,
# effects, absorb/reflect bubbles, model parts, empty move slots).

