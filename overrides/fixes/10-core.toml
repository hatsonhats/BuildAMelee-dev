[[fix]]
id = "special-samus-bomb-jump-owner"
owner = "platform/specials"
file = "src/melee/ft/kinds/ftSamus/ftsamusspeciallw0.c"
anchor = "    Fighter* fp = GET_FIGHTER(gobj);\n    ftSs_DatAttrs* da = fp->dat_attrs;\n    float float_result = ftSs_Init_80128AC8(gobj, farg1, farg2);\n\n    u8 _[8];\n\n    if (!ftColl_8007B868(gobj)) {\n        switch (fp->x2070.x2071_b0_3) {\n        case 0:\n        case 2:\n        case 3:\n        case 4:\n            if ((fp->x2070.x2073 == 0x14) || ((fp->x2070.x2071_b5) == 0)) {"
replacement = "    Fighter* fp = GET_FIGHTER(gobj);\n    ftSs_DatAttrs* da;\n    float float_result;\n\n    u8 _[8];\n\n    if (!ftColl_8007B868(gobj)) {\n        switch (fp->x2070.x2071_b0_3) {\n        case 0:\n        case 2:\n        case 3:\n        case 4:\n            if (((fp->x2070.x2073 == 0x14) || ((fp->x2070.x2071_b5) == 0)) &&\n                Rogue_AbilityOwnerResume(fp, Ft_Kind_Samus, ROGUE_ABILITY_DOWN)) {\n                /* Read Samus's attributes only once her move is installed. */\n                da = fp->dat_attrs;\n                float_result = ftSs_Init_80128AC8(gobj, farg1, farg2);"
reason = "Bomb jump: a Samus bomb exploding on its owner puts the owner back into Samus's down special. For a fighter with borrowed bombs the move had already ended, so the jump read the fighter's own attributes as Samus's and entered its own unrelated motion 0x156. Re-install the borrowed move first, or skip the jump if it is no longer equipped."

