# Host tests for the build tools (no ISO or compiler needed). A full build
# needs the player's own Melee ISO, so it runs locally: `bam.py check`.
name: tests
on:
  push:
  pull_request:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
